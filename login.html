<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Prime Traders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#020617] text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-amber-500/30 p-8 rounded-2xl max-w-md w-full shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-amber-500 rounded-xl mx-auto flex items-center justify-center text-black text-2xl font-black">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="text-xl font-black uppercase text-amber-400">Admin Login</h1>
            <p class="text-xs text-slate-400">Access Your Admin Dashboard Securely</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-300 mb-1 font-bold uppercase text-[10px]">Admin Email *</label>
                <input type="email" id="loginEmail" placeholder="admin@primetraders.com" required class="w-full p-3 bg-black border border-amber-500/30 rounded-xl text-white outline-none focus:border-amber-400">
            </div>
            <div>
                <label class="block text-slate-300 mb-1 font-bold uppercase text-[10px]">Password *</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required class="w-full p-3 bg-black border border-amber-500/30 rounded-xl text-white outline-none focus:border-amber-400">
            </div>
            <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-black font-black rounded-xl uppercase tracking-wider transition shadow-lg shadow-amber-500/20">
                <i class="fa-solid fa-right-to-bracket mr-2"></i> Login to Dashboard
            </button>
        </form>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AizaSyCRkkoE48FjYIjYfUNFEYzcxNueKuM6YOM",
            authDomain: "prime-traders-f3eec.firebaseapp.com",
            projectId: "prime-traders-f3eec",
            storageBucket: "prime-traders-f3eec.firebasestorage.app",
            messagingSenderId: "499740236001",
            appId: "1:499740236001:web:e623dfe1f6f96df22ffa0",
            measurementId: "G-6CGVKBZFJK"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;

            auth.signInWithEmailAndPassword(email, pass)
            .then(() => {
                window.location.href = "index.html"; // Login ke baad 2nd screen (Master Control Panel) khulegi
            })
            .catch(err => alert("Login Failed: " + err.message));
        }
    </script>
</body>
</html>
