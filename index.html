<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Prime Traders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .bg-custom-fit {
            background-image: url('bg-login.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-custom-fit min-h-screen w-full flex items-center justify-end p-4 md:p-8 relative">

    <!-- Right Side Clean White Login Box -->
    <div class="bg-white/95 border border-slate-200 p-6 md:p-8 rounded-3xl max-w-md w-full shadow-2xl space-y-5 text-slate-900 backdrop-blur-md relative z-10 mr-0 md:mr-12">
        
        <!-- Logo Header -->
        <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-blue-900 rounded-2xl mx-auto flex items-center justify-center text-amber-400 text-3xl font-black shadow-lg">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="text-2xl font-black tracking-wider text-slate-900 uppercase">Admin Login</h1>
            <p class="text-xs text-slate-500 font-semibold">Access Your Admin Dashboard</p>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-700 mb-1 font-bold uppercase text-[10px]">Admin ID / Username</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3 top-3.5 text-slate-400"></i>
                    <input type="email" id="loginEmail" placeholder="admin@primetraders.com" required class="w-full pl-9 p-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 outline-none focus:border-blue-600 transition font-medium">
                </div>
            </div>
            <div>
                <label class="block text-slate-700 mb-1 font-bold uppercase text-[10px]">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-3.5 text-slate-400"></i>
                    <input type="password" id="loginPassword" placeholder="••••••••" required class="w-full pl-9 pr-10 p-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 outline-none focus:border-blue-600 transition font-medium">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-3.5 text-slate-400 hover:text-blue-600 focus:outline-none">
                        <i id="eyeIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
                
                <div class="flex items-center justify-between mt-2 text-[11px]">
                    <label class="flex items-center gap-2 text-slate-600 cursor-pointer">
                        <input type="checkbox" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500"> Remember Me
                    </label>
                    <button type="button" onclick="handleForgotPassword()" class="text-blue-600 hover:underline font-bold">Forgot Password?</button>
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-[#0a192f] hover:bg-blue-900 text-white font-black rounded-xl text-xs tracking-wider uppercase shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>
        </form>

        <!-- Footer branding -->
        <div class="border-t border-slate-200 pt-3 text-center text-[10px] text-slate-500 space-y-0.5">
            <p class="font-bold text-slate-700">Powered by</p>
            <p class="font-black text-slate-900 uppercase">Prime Traders Logistics & Express</p>
            <p class="text-slate-400">Logistics + White Label | One Admin Panel</p>
        </div>
    </div>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Scripts & Firebase Initialization -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAcb38R8nTN-6wJxqy6L5wnB55JQ8qwcjM",
            authDomain: "prime-traders-f3eec.firebaseapp.com",
            projectId: "prime-traders-f3eec",
            storageBucket: "prime-traders-f3eec.firebasestorage.app",
            messagingSenderId: "499740236001",
            appId: "1:499740236001:web:e623dfe1f6f96df22ffa0",
            measurementId: "G-6CGVKBZFJK"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('loginPassword');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;

            if (email !== "admin@primetraders.com") {
                alert("Access Denied: Sirf Admin ID se login ki ijazat hai!");
                return;
            }

            auth.signInWithEmailAndPassword(email, pass)
    .then(() => {  
        // Login hote hi seedha 2-buttons wala Hub page khulega
        window.location.href = 'whitelabel.html';  
    })
                .catch(err => {  
                    alert("Login Error: " + err.message);  
                });
        }

        function handleForgotPassword() {
            const email = document.getElementById('loginEmail').value;
            if (!email) {
                alert("Pehle email enter karein.");
                return;
            }
            auth.sendPasswordResetEmail(email)
                .then(() => {  
                    alert("Password reset email bhej di gayi hai!");  
                })
                .catch(err => {  
                    alert("Error: " + err.message);  
                });
        }
    </script>
</body>
</html>
